<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitación — Sakura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <img src="img/fondo.jpg" alt="Fondo Sakura" class="hero-bg">
      <div class="hero-content">
        <img src="img/sakura.png" alt="Sakura" class="logo">
        <h1>Te invito a mi cumpleaños</h1>
        <p class="subtitle">Celebración bajo flores de sakura</p>
      </div>
    </header>

    <section class="card">
      <h2>Detalles</h2>
      <ul>
        <li><strong>Fecha:</strong> 20 de agosto de 2026</li>
        <li><strong>Hora:</strong> 18:00</li>
        <li><strong>Lugar:</strong> Jardín Sakura — Calle Primavera 123</li>
      </ul>

      <div class="images">
        <img src="img/abanico.png" alt="Abanico" class="small-img">
      </div>

      <div class="actions">
        <button id="rsvp-yes" class="btn primary">Sí, asistiré</button>
        <button id="rsvp-no" class="btn">No podré ir</button>
      </div>

      <p class="note">Pulsa "Sí, asistiré" para confirmar. Puedes reemplazar las imágenes en la carpeta <code>img/</code>.</p>
    </section>

    <footer class="footer">
      <p>Creado con ❤️ — Invitacion_Sakura</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
